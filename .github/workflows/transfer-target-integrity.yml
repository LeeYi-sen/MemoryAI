name: transfer-target-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transfer_target_integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify direct source layout
        run: python3 tools/test_repository_source_layout.py
      - name: Assert transfer verification sees mutation journal
        run: |
          grep -n 'physicalMemoryWithJournal' Kernel/src/remote_durability_runtime.go
          grep -n 'persistEngineIncremental(dst)' Kernel/src/remote_durability_runtime.go
          grep -n 'persistEngineIncremental(owner)' Kernel/src/remote_durability_runtime.go
      - name: Run transfer regressions
        env:
          GO111MODULE: "off"
        run: go test -race ./Kernel/src -run 'TransferMemoryDurable|RollbackUnpersistedTransferCandidate|FailedTransferPersistence|PhysicalMemoryWithJournal|TransferProbeTreatsJournal'
