name: mesh-memory-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mesh_memory_integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify direct source layout
        run: python3 tools/test_repository_source_layout.py
      - name: Reject active Mesh sidecars
        run: |
          python3 tools/architecture_audit.py
          ! grep -n 'Memory.mesh-journal.' Kernel/src/mesh_journal_runtime.go
          ! grep -n 'Memory.mesh-proposal-replay.' Kernel/src/mesh_proposal_replay_runtime.go
      - name: Run Mesh Memory durability regressions
        env:
          GO111MODULE: "off"
        run: go test -race ./Kernel/src -run 'MeshDeferredJournal|MeshProposalReplay|SovereignDirectory|MeshGrantSideEffect'
