name: source-integrity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source_integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without external actions
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify bootstrap source hashes
        run: python3 tools/restore_source.py --check

      - name: Restore build source
        run: python3 tools/restore_source.py

      - name: Compile source migration tools
        run: |
          python3 -m py_compile tools/restore_source.py
          python3 -m py_compile tools/kernel_*_overlay.py
          python3 -m py_compile tools/migrations/*.py

      - name: Enforce formatted Go source
        run: |
          UNFORMATTED="$(gofmt -l Kernel/src/*.go)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go source:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet Kernel package
        env:
          GO111MODULE: "off"
        run: go vet ./Kernel/src

      - name: Compile and test Kernel package
        env:
          GO111MODULE: "off"
        run: go test ./Kernel/src

      - name: Race-test Kernel package
        env:
          GO111MODULE: "off"
        run: go test -race ./Kernel/src

      - name: Assert Kernel remains physical-only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kernel = Path('Kernel/src/kernel.go').read_text(encoding='utf-8')
          activation = Path('Kernel/src/activation_runtime.go').read_text(encoding='utf-8')
          scheduler = Path('Kernel/src/scheduler_runtime.go').read_text(encoding='utf-8')
          lazy = Path('Kernel/src/speculative_lazy.go').read_text(encoding='utf-8')
          mesh = Path('Kernel/src/mesh_runtime.go').read_text(encoding='utf-8')
          mesh_grant = Path('Kernel/src/mesh_grant_runtime.go').read_text(encoding='utf-8')
          mesh_transport = Path('Kernel/src/mesh_transport_security.go').read_text(encoding='utf-8')
          scale = Path('Kernel/src/scale_runtime.go').read_text(encoding='utf-8')
          persistence = Path('Kernel/src/persistence_runtime.go').read_text(encoding='utf-8')
          shard = Path('Kernel/src/shard_runtime.go').read_text(encoding='utf-8')
          store_access = Path('Kernel/src/store_access_runtime.go').read_text(encoding='utf-8')
          structure = Path('Kernel/src/structure_runtime.go').read_text(encoding='utf-8')
          lifetime_test = Path('Kernel/src/store_lifetime_test.go').read_text(encoding='utf-8')

          required_kernel = [
              'RuntimeExecCount uint64',
              'bindMeshEngine(e)',
              'speculativeAdditionalForbiddenPrimitive(op.Code)',
              'recordSpeculativeBaseline(e, id, m)',
              'localMemoryCountFast(e)',
              'boundedLegacyBodyIDs(e)',
              'remote_space_import disabled:',
              'lockEnginePersistence(e)',
              'snapshotMemoriesForPersistence(e)',
              'finalizePersistedBody(e, out, persistedSnapshot)',
              'e.validateStore()',
              'sp.validateStore()',
          ]
          missing = [x for x in required_kernel if x not in kernel]
          if missing:
              raise SystemExit(f'generated Kernel boundary assertions missing: {missing}')

          forbidden_kernel = [
              'reuse_count,omitempty',
              'real_trials,omitempty',
              'successes,omitempty',
              'total_reward,omitempty',
              'total_cost,omitempty',
              'stability,omitempty',
              'case "metric_add"',
              'm.Reuse++',
              'if src.Reward > dst.Reward',
              'if src.Stability > dst.Stability',
              'case "body_list":\n\t\tids, err := e.localIDs()',
              'func (e *Engine) localMemoryCount() int {\n\tids, err := e.localIDs()',
              'validateIndexedStore(e.store)',
              'validateIndexedStore(sp.store)',
          ]
          bad = [x for x in forbidden_kernel if x in kernel]
          if bad:
              raise SystemExit(f'forbidden Kernel policy/scale/store path reintroduced: {bad}')

          required_activation = [
              'Score:      0',
              'selection_order',
              'stable-memory-id',
              'cognitive_ranking',
              'false',
              'persisted_secondary_index',
              'storeHasPhysicalFeatureIndex()',
              'storePhysicalFeatureIDs(',
          ]
          missing = [x for x in required_activation if x not in activation]
          if missing:
              raise SystemExit(f'activation physical-boundary assertions missing: {missing}')
          forbidden_activation = [
              'FeatureHit > out[j].FeatureHit',
              'exactActivationScore(',
              'e.store.HasPhysicalFeatureIndex()',
              'e.store.PhysicalFeatureIDs(',
              'e.store.AllIDs()',
              'e.store.GetID(',
          ]
          bad = [x for x in forbidden_activation if x in activation]
          if bad:
              raise SystemExit(f'activation ranking/store lifetime regression: {bad}')

          if 'snapshotForSpeculationLazy(snapshotMemoryLimit())' not in scheduler:
              raise SystemExit('scheduler no longer uses lazy speculative snapshots')
          if 'snapshotForSpeculation(snapshotMemoryLimit())' in scheduler:
              raise SystemExit('scheduler regressed to full Memory snapshot')
          for token in [
              'releaseStore func()',
              'pinnedSpeculativeStore',
              'acquireStoreLifetimeLease()',
              'snapshot working-set limit exceeded',
              'LoadAndDelete',
          ]:
              if token not in lazy:
                  raise SystemExit(f'lazy read-set/store lease boundary missing: {token}')
          if 'acquireStoreLifetimeLease()' in scheduler:
              raise SystemExit('scheduler reintroduced duplicate store RLock around lazy snapshot')

          for token in [
              'localMemoryCountFast',
              'persistedCount > max',
              'storeMemoryCount()',
              'body_list disabled',
              'use exact/tag/activation indexing',
          ]:
              if token not in scale:
                  raise SystemExit(f'bounded scale behavior missing: {token}')

          persistence_required = [
              'lockEnginePersistence',
              'snapshotMemoriesForPersistence',
              'structuralMemoryDigest',
              'RuntimeExecCount = 0',
              'rebuildPendingTagDeltasLocked',
              'indexedStoreGuard(old)',
              'writtenDigest',
              'persistEngineIfDirty',
          ]
          missing = [x for x in persistence_required if x not in persistence]
          if missing:
              raise SystemExit(f'persistence concurrency boundary missing: {missing}')

          shard_required = [
              'MEMORYAI_SHARD_MAX_MEMORIES',
              'mountAutomaticStorageShards',
              'createAutomaticWritableShard',
              'placeRuntimeMemory',
              'automaticShardMu',
          ]
          missing = [x for x in shard_required if x not in shard]
          if missing:
              raise SystemExit(f'bounded physical shard boundary missing: {missing}')

          store_required = [
              'indexedStoreLifetime',
              'indexedStoreGuard',
              'pinnedSpeculativeStore',
              'acquireStoreLifetimeLease',
              'validateStore',
          ]
          missing = [x for x in store_required if x not in store_access]
          if missing:
              raise SystemExit(f'live IndexedStore lifetime boundary missing: {missing}')

          structure_required = [
              'remote Memory import disabled; use Sovereign Mesh direct read',
              'q.RuntimeExecCount = 0',
              'persistedOld, persistedErr := e.storeGetID(q.ID)',
          ]
          missing = [x for x in structure_required if x not in structure]
          if missing:
              raise SystemExit(f'structure/direct-read boundary missing: {missing}')
          forbidden_structure = [
              'validateMemoryCapabilities(&m, remote)',
              'e.dataMu.Lock()\n\tif old := e.cache[q.ID];',
          ]
          bad = [x for x in forbidden_structure if x in structure]
          if bad:
              raise SystemExit(f'structure import/deadlock regression: {bad}')

          mesh_required = [
              'remote_memory_semantics',
              'direct-read-no-import',
              'shared_authorization',
              'sovereign-memory-event+ed25519-grant',
              'e.fireEvent("mesh.shared.proposal"',
              'stable-physical-availability-only',
              'consumeMeshGrant(req.Grant',
              'shared_grant',
              'cross_host_transport',
              'tls-required',
          ]
          missing = [x for x in mesh_required if x not in mesh]
          if missing:
              raise SystemExit(f'Sovereign Mesh boundary assertions missing: {missing}')

          grant_required = [
              'ed25519.Sign',
              'ed25519.Verify',
              'mesh grant replay rejected',
              'ExpiresUnix',
              'TargetNode',
              'MEMORYAI_MESH_SOVEREIGN_PRIVATE_KEY_B64',
              'MEMORYAI_MESH_SOVEREIGN_PUBLIC_KEY_B64',
          ]
          missing = [x for x in grant_required if x not in mesh_grant]
          if missing:
              raise SystemExit(f'Sovereign grant boundary assertions missing: {missing}')

          transport_required = [
              'plaintext mesh HTTP is restricted to loopback',
              'non-loopback mesh listener requires',
              'wildcard mesh listener requires explicit MEMORYAI_MESH_ENDPOINT',
              'mesh endpoint cannot advertise an unspecified bind address',
          ]
          missing = [x for x in transport_required if x not in mesh_transport]
          if missing:
              raise SystemExit(f'Mesh transport boundary assertions missing: {missing}')

          test_required = [
              'TestUpsertExplicitMemoryDoesNotReenterDataLock',
              'TestRemoteJSONImportIsDirectReadOnly',
              'TestSpeculativePinnedStoreAvoidsNestedReadDeadlock',
              'TestPersistWaitsForSpeculativeStoreLease',
          ]
          missing = [x for x in test_required if x not in lifetime_test]
          if missing:
              raise SystemExit(f'store lifetime regression tests missing: {missing}')

          print('Kernel physical-only/source-integrity boundaries: PASS')
          PY
