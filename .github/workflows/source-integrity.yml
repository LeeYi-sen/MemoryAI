name: source-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source_integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without external actions
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify bootstrap source hashes
        run: python3 tools/restore_source.py --check

      - name: Restore generated Kernel source
        run: python3 tools/restore_source.py

      - name: Compile migration and overlay tools
        run: |
          python3 -m py_compile tools/restore_source.py
          python3 -m py_compile tools/kernel_*_overlay.py
          python3 -m py_compile tools/migrations/*.py

      - name: Enforce formatted Go source
        run: |
          UNFORMATTED="$(gofmt -l Kernel/src/*.go)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go source:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet Kernel package
        env:
          GO111MODULE: "off"
        run: go vet ./Kernel/src

      - name: Compile and test Kernel package
        env:
          GO111MODULE: "off"
        run: go test ./Kernel/src

      - name: Race-test Kernel package
        env:
          GO111MODULE: "off"
        run: go test -race ./Kernel/src

      - name: Assert frozen architecture boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = {
              'kernel': 'Kernel/src/kernel.go',
              'activation': 'Kernel/src/activation_runtime.go',
              'activation_exact': 'Kernel/src/activation_exact.go',
              'activation_fabric_test': 'Kernel/src/activation_fabric_test.go',
              'scheduler': 'Kernel/src/scheduler_runtime.go',
              'event': 'Kernel/src/event_runtime.go',
              'lazy': 'Kernel/src/speculative_lazy.go',
              'spec_boundary': 'Kernel/src/speculative_boundary_extra.go',
              'spec_commit': 'Kernel/src/speculative_fabric_commit.go',
              'spec_fabric_test': 'Kernel/src/speculative_fabric_test.go',
              'mesh': 'Kernel/src/mesh_runtime.go',
              'grant': 'Kernel/src/mesh_grant_runtime.go',
              'transport': 'Kernel/src/mesh_transport_security.go',
              'scale': 'Kernel/src/scale_runtime.go',
              'persistence': 'Kernel/src/persistence_runtime.go',
              'shard': 'Kernel/src/shard_runtime.go',
              'store': 'Kernel/src/store_access_runtime.go',
              'fabric': 'Kernel/src/fabric_write_runtime.go',
              'fabric_read': 'Kernel/src/fabric_read_runtime.go',
              'fabric_context': 'Kernel/src/fabric_context_runtime.go',
              'fabric_execution_test': 'Kernel/src/fabric_execution_test.go',
              'fabric_vm_test': 'Kernel/src/fabric_vm_test.go',
              'structure': 'Kernel/src/structure_runtime.go',
              'source_adapter': 'Kernel/src/source_adapter_runtime.go',
              'lifetime_test': 'Kernel/src/store_lifetime_test.go',
              'fabric_test': 'Kernel/src/fabric_write_runtime_test.go',
              'digest_test': 'Kernel/src/memory_digest_test.go',
              'fabric_execution_overlay': 'tools/kernel_fabric_execution_overlay.py',
              'restore': 'tools/restore_source.py',
          }
          files = {name: Path(path).read_text(encoding='utf-8') for name, path in paths.items()}

          def require(name, tokens):
              missing = [x for x in tokens if x not in files[name]]
              if missing:
                  raise SystemExit(f'{name} required boundary missing: {missing}')

          def forbid(name, tokens):
              bad = [x for x in tokens if x in files[name]]
              if bad:
                  raise SystemExit(f'{name} forbidden boundary regression: {bad}')

          # Minimal physical Kernel: no cognitive metric mutation/ranking.
          require('kernel', [
              'RuntimeExecCount uint64', 'bindMeshEngine(e)',
              'speculativeAdditionalForbiddenPrimitive(op.Code)',
              'recordSpeculativeBaseline(e, id, m)', 'localMemoryCountFast(e)',
              'boundedLegacyBodyIDs(e)', 'remote_space_import disabled:',
              'lockEnginePersistence(e)', 'snapshotMemoriesForPersistence(e)',
              'finalizePersistedBody(e, out, persistedSnapshot)',
              'e.validateStore()', 'sp.validateStore()',
              'executionOwner := e.ownerOf(m.ID)',
              'executionOwner.dataMu.Lock()',
              'root.resolveLocalFabricMemory(id)',
              'root.listTagFabricOwned(idOrTag)',
          ])
          forbid('kernel', [
              'reuse_count,omitempty', 'real_trials,omitempty', 'successes,omitempty',
              'total_reward,omitempty', 'total_cost,omitempty', 'stability,omitempty',
              'case "metric_add"', 'm.Reuse++',
              'validateIndexedStore(e.store)', 'validateIndexedStore(sp.store)',
          ])

          require('fabric_execution_overlay', [
              'unique local exact resolver', 'unique mutable Fabric resolver',
              'unique Fabric owner lookup', 'run physical-owner lock',
              'root.resolveLocalFabricMemory(id)',
              'root.listTagFabricOwned(idOrTag)',
              'executionOwner.dataMu.Lock()',
          ])
          require('restore', [
              'apply_kernel_fabric_execution_overlay',
              'current = apply_kernel_fabric_execution_overlay(current)',
          ])

          require('activation', [
              'Score:      0', 'stable-memory-id', 'cognitive_ranking',
              'storeHasPhysicalFeatureIndex()', 'storePhysicalFeatureIDs(',
              'fabricMemoryCountFast(root)',
              'fabric-persisted-exact-index+per-body-live-overlay',
          ])
          forbid('activation', [
              'FeatureHit > out[j].FeatureHit', 'exactActivationScore(',
              'e.store.HasPhysicalFeatureIndex()', 'e.store.PhysicalFeatureIDs(',
              'e.store.AllIDs()', 'e.store.GetID(',
          ])
          require('activation_exact', ['storePhysicalFeatureIDs(feature)'])
          require('activation_fabric_test', [
              'TestActivationSeesPersistedPassiveShard',
              'TestActivationBuildCountsCompleteFabric',
              'TestActivationShardDirtyOverlayShadowsPersistedPosting',
              'TestActivationQualificationUsesFullFabricReference',
              'TestActivationPrimaryLiveOverlayRemainsVisible',
          ])

          require('scheduler', [
              'snapshotForSpeculationLazy(snapshotMemoryLimit())',
              'commitFabricSnapshotDiff(base, diff, ce)',
              'releaseSpeculativeStoreLease(ce)',
              'root := fabricRootFor(e)',
              'return root.run(id, f)',
              'f.Vars["__txn_canonical"] = "1"',
              'execution-long-lease+release-before-commit',
              'fabric-root-resolver-single-lane',
              'canonical-only-bounded-placement',
          ])
          forbid('scheduler', [
              'snapshotForSpeculation(snapshotMemoryLimit())',
              'fabric-owner-aware-single-lane',
              'rememberFabricOwner(root, owner)',
              'return owner.run(id, f)',
              'acquireStoreLifetimeLease()',
          ])

          require('event', [
              'eventFabricRoot', 'root.ensureEventPhysicalIndex()',
              'globalActivationRuntime.ExactFeatureIDs',
              'root.resolveLocalFabricMemory(id)',
              'globalTxnScheduler.run(root, id, f)',
              'f.Vars["__txn_canonical"] == "1"',
              'root.run(id, f)',
              'outer scheduler already owns the canonical lane',
          ])
          forbid('event', ['owner.run(id, f)'])

          require('spec_boundary', [
              'memory_new', 'memory_copy', 'mesh_shared_reconcile',
              'mesh_route_cognition', 'cognition_concurrency_set',
          ])
          require('lazy', [
              'releaseStore func()', 'pinnedSpeculativeStore',
              'recordSpeculativeOwnerHints', 'clearSpeculativeOwnerHint',
              'speculativePhysicalOwner', 'releaseSpeculativeStoreLease',
              'storeGuard := indexedStoreGuard(store)', 'storeGuard.RLock()',
              'snapshot working-set limit exceeded', 'LoadAndDelete',
          ])
          require('spec_commit', [
              'commitFabricSnapshotDiff', 'speculativePhysicalOwner',
              'physicalOwnerMemoryLocked', 'lockSpeculativeCommitOwners',
              'All owners are locked in deterministic physical-path order',
              'len(d.created) != 0',
          ])
          require('spec_fabric_test', [
              'TestSpeculativeCommitPreservesShardOwner',
              'TestSpeculativeShardConflictDoesNotOverwriteConcurrentMutation',
              'TestSpeculativeCrossOwnerConflictIsZeroWrite',
              'TestSpeculativeShardFallbackDoesNotReenterPinnedPrimaryStore',
              'TestSpeculativeUnreadOwnerHintRetargetsAfterShardMove',
          ])

          require('scale', [
              'localMemoryCountFast', 'fabricMemoryCountFast',
              'body_list disabled', 'use exact/tag/activation indexing',
          ])
          forbid('scale', ['e.store.memoryCount', 'e.store.GetID('])

          require('persistence', [
              'lockEnginePersistence', 'snapshotMemoriesForPersistence',
              'structuralMemoryDigest', 'RuntimeExecCount = 0',
              'rebuildPendingTagDeltasLocked', 'indexedStoreGuard(old)',
              'writtenDigest', 'persistEngineIfDirty',
          ])
          require('shard', [
              'MEMORYAI_SHARD_MAX_MEMORIES', 'mountAutomaticStorageShards',
              'createAutomaticWritableShard', 'placeRuntimeMemoryLocked',
              'placeRuntimeMemory', 'automaticShardMu',
          ])

          require('store', [
              'indexedStoreLifetime', 'indexedStoreGuard', 'pinnedSpeculativeStore',
              'clearSpeculativeOwnerHint', 'resolveMountedShardMemoryCopy',
              'recordSpeculativeOwnerHints', 'listTagMountedShardsOwned',
              'physicalFeatureIDsMountedShardsOwned',
              'storePhysicalFeatureIDsLocal', 'storeHasPhysicalFeatureIndexLocal',
              'acquireStoreLifetimeLease', 'validateStore',
          ])
          forbid('store', [
              'origin.listTagFabricOwned(tag)',
              'origin.physicalFeatureIDsFabricOwned(feature)',
          ])

          require('fabric_context', [
              'fabricRootRegistry', 'rememberFabricOwner', 'fabricRootFor',
              'No semantic or cognitive state is stored here',
          ])
          require('fabric', [
              'resolveLocalFabricMemory', 'duplicate local Fabric Memory id',
              'listTagFabricOwned', 'listTagMountedShardsOwned',
              'rememberFabricOwner(e, item.eng)', 'fabricRootFor(e)',
              'automaticShardMu.Lock()', 'placeRuntimeMemoryLocked(q)',
              'upsertExplicitMemoryOnOwner', 'upsertExplicitMemoryBounded',
              'deleteExplicitMemoryBounded',
          ])
          require('fabric_read', [
              'resolveMountedShardMemoryCopy', 'resolveSpecificOwnerMemoryCopy',
              'physicalFeatureIDsAcrossEngines',
              'physicalFeatureIDsMountedShardsOwned',
              'storeHasPhysicalFeatureIndexLocal', 'storeAllIDsLocal',
          ])

          require('structure', [
              'remote Memory import disabled; use Sovereign Mesh direct read',
              'q.RuntimeExecCount = 0', 'resolveLocalFabricMemory(',
              'upsertExplicitMemoryBounded(', 'deleteExplicitMemoryBounded(',
          ])
          forbid('structure', [
              'validateMemoryCapabilities(&m, remote)',
              'e.resolveIDLocal(', 'e.upsertExplicitMemory(',
          ])
          require('source_adapter', [
              'resolveLocalFabricMemory(', 'listTagFabric(',
              'upsertExplicitMemoryBounded(', 'deleteExplicitMemoryBounded(',
          ])

          require('mesh', [
              'direct-read-no-import', 'sovereign-memory-event+ed25519-grant',
              'consumeMeshGrant(req.Grant', 'shared_grant', 'tls-required',
              'resolveLocalFabricMemoryCopy(strings.TrimSpace(id))',
              'resolveLocalFabricMemory(strings.TrimSpace(id))',
              'globalTxnScheduler.run(owner, id, f)',
          ])
          forbid('mesh', [
              'mem, err := e.resolveIDLocal(strings.TrimSpace(id))',
              'if _, err := e.resolveExecutable(id); err == nil',
          ])
          require('grant', [
              'ed25519.Sign', 'ed25519.Verify', 'mesh grant replay rejected',
              'ExpiresUnix', 'TargetNode',
          ])
          require('transport', [
              'plaintext mesh HTTP is restricted to loopback',
              'non-loopback mesh listener requires',
              'wildcard mesh listener requires explicit MEMORYAI_MESH_ENDPOINT',
          ])

          require('fabric_execution_test', [
              'TestMeshServeLocalMemoryReadsPassiveShard',
              'TestMeshServeLocalExecutionRunsPassiveShardProgram',
              'TestEventDispatchRunsHandlerFromPassiveShard',
              'TestEventSubjectTagResolvesSubjectFromPassiveShard',
              'TestCanonicalEventDispatchDoesNotReenterSchedulerLane',
              'TestCanonicalEventHandlerKeepsSiblingShardVisibility',
          ])
          require('fabric_vm_test', [
              'TestCanonicalVMKeepsRootFabricAcrossSiblingShards',
              'TestCanonicalVMRejectsDuplicateFabricStateGet',
              'TestCanonicalVMRejectsDuplicateFabricStateSetWithoutWrite',
          ])
          require('lifetime_test', [
              'TestUpsertExplicitMemoryDoesNotReenterDataLock',
              'TestRemoteJSONImportIsDirectReadOnly',
              'TestSpeculativePinnedStoreAvoidsNestedReadDeadlock',
              'TestPersistWaitsForSpeculativeStoreLease',
              'TestReleaseSpeculativeStoreLeaseBreaksPersistCommitLockCycle',
          ])
          require('fabric_test', [
              'TestExplicitImportCreatesInBoundedShard',
              'TestExplicitImportUpdatesExistingShardOwnerWithoutDuplicate',
              'TestDuplicateFabricIdentityIsRejected',
              'TestSourceAdapterLivesAcrossStorageShard',
          ])
          require('digest_test', ['TestMemoryStructuralDigestIgnoresRuntimeExecCount'])

          print('Kernel frozen architecture boundaries: PASS')
          PY
