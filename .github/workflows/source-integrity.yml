name: source-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source_integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without external actions
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify bootstrap source hashes
        run: python3 tools/restore_source.py --check

      - name: Restore generated Kernel source
        run: python3 tools/restore_source.py

      - name: Compile migration and overlay tools
        run: |
          python3 -m py_compile tools/restore_source.py
          python3 -m py_compile tools/kernel_*_overlay.py
          python3 -m py_compile tools/migrations/*.py

      - name: Enforce formatted Go source
        run: |
          UNFORMATTED="$(gofmt -l Kernel/src/*.go)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go source:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet Kernel package
        env:
          GO111MODULE: "off"
        run: go vet ./Kernel/src

      - name: Compile and test Kernel package
        env:
          GO111MODULE: "off"
        run: go test ./Kernel/src

      - name: Race-test Kernel package
        env:
          GO111MODULE: "off"
        run: go test -race ./Kernel/src

      - name: Assert frozen architecture boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
              name: Path(path).read_text(encoding='utf-8')
              for name, path in {
                  'kernel': 'Kernel/src/kernel.go',
                  'activation': 'Kernel/src/activation_runtime.go',
                  'scheduler': 'Kernel/src/scheduler_runtime.go',
                  'lazy': 'Kernel/src/speculative_lazy.go',
                  'mesh': 'Kernel/src/mesh_runtime.go',
                  'grant': 'Kernel/src/mesh_grant_runtime.go',
                  'transport': 'Kernel/src/mesh_transport_security.go',
                  'scale': 'Kernel/src/scale_runtime.go',
                  'persistence': 'Kernel/src/persistence_runtime.go',
                  'shard': 'Kernel/src/shard_runtime.go',
                  'store': 'Kernel/src/store_access_runtime.go',
                  'fabric': 'Kernel/src/fabric_write_runtime.go',
                  'structure': 'Kernel/src/structure_runtime.go',
                  'source_adapter': 'Kernel/src/source_adapter_runtime.go',
                  'lifetime_test': 'Kernel/src/store_lifetime_test.go',
                  'fabric_test': 'Kernel/src/fabric_write_runtime_test.go',
                  'digest_test': 'Kernel/src/memory_digest_test.go',
              }.items()
          }

          def require(name, tokens):
              missing = [x for x in tokens if x not in files[name]]
              if missing:
                  raise SystemExit(f'{name} required boundary missing: {missing}')

          def forbid(name, tokens):
              bad = [x for x in tokens if x in files[name]]
              if bad:
                  raise SystemExit(f'{name} forbidden boundary regression: {bad}')

          require('kernel', [
              'RuntimeExecCount uint64',
              'bindMeshEngine(e)',
              'speculativeAdditionalForbiddenPrimitive(op.Code)',
              'recordSpeculativeBaseline(e, id, m)',
              'localMemoryCountFast(e)',
              'boundedLegacyBodyIDs(e)',
              'remote_space_import disabled:',
              'lockEnginePersistence(e)',
              'snapshotMemoriesForPersistence(e)',
              'finalizePersistedBody(e, out, persistedSnapshot)',
              'e.validateStore()',
              'sp.validateStore()',
          ])
          forbid('kernel', [
              'reuse_count,omitempty', 'real_trials,omitempty', 'successes,omitempty',
              'total_reward,omitempty', 'total_cost,omitempty', 'stability,omitempty',
              'case "metric_add"', 'm.Reuse++',
              'validateIndexedStore(e.store)', 'validateIndexedStore(sp.store)',
          ])

          require('activation', [
              'Score:      0', 'stable-memory-id', 'cognitive_ranking',
              'storeHasPhysicalFeatureIndex()', 'storePhysicalFeatureIDs(',
          ])
          forbid('activation', [
              'FeatureHit > out[j].FeatureHit', 'exactActivationScore(',
              'e.store.HasPhysicalFeatureIndex()', 'e.store.PhysicalFeatureIDs(',
              'e.store.AllIDs()', 'e.store.GetID(',
          ])

          require('scheduler', [
              'snapshotForSpeculationLazy(snapshotMemoryLimit())',
              'lazy-snapshot-owned-shared-lease',
          ])
          forbid('scheduler', [
              'snapshotForSpeculation(snapshotMemoryLimit())',
              'acquireStoreLifetimeLease()',
          ])

          require('lazy', [
              'releaseStore func()', 'pinnedSpeculativeStore',
              'storeGuard := indexedStoreGuard(store)', 'storeGuard.RLock()',
              'snapshot working-set limit exceeded', 'LoadAndDelete',
          ])

          require('scale', [
              'localMemoryCountFast', 'persistedCount > max', 'storeMemoryCount()',
              'body_list disabled', 'use exact/tag/activation indexing',
          ])
          forbid('scale', ['e.store.memoryCount', 'e.store.GetID('])

          require('persistence', [
              'lockEnginePersistence', 'snapshotMemoriesForPersistence',
              'structuralMemoryDigest', 'RuntimeExecCount = 0',
              'rebuildPendingTagDeltasLocked', 'indexedStoreGuard(old)',
              'writtenDigest', 'persistEngineIfDirty',
          ])

          require('shard', [
              'MEMORYAI_SHARD_MAX_MEMORIES', 'mountAutomaticStorageShards',
              'createAutomaticWritableShard', 'placeRuntimeMemoryLocked',
              'placeRuntimeMemory', 'automaticShardMu',
          ])

          require('store', [
              'indexedStoreLifetime', 'indexedStoreGuard', 'pinnedSpeculativeStore',
              'acquireStoreLifetimeLease', 'validateStore',
          ])

          require('fabric', [
              'resolveLocalFabricMemory', 'duplicate local Fabric Memory id',
              'listTagFabric', 'automaticShardMu.Lock()',
              'placeRuntimeMemoryLocked(q)', 'upsertExplicitMemoryOnOwner',
              'upsertExplicitMemoryBounded', 'deleteExplicitMemoryBounded',
          ])
          forbid('fabric', ['owner.addRuntimeMemory(q)'])

          require('structure', [
              'remote Memory import disabled; use Sovereign Mesh direct read',
              'q.RuntimeExecCount = 0',
              'resolveLocalFabricMemory(', 'upsertExplicitMemoryBounded(',
              'deleteExplicitMemoryBounded(',
          ])
          forbid('structure', [
              'validateMemoryCapabilities(&m, remote)',
              'e.resolveIDLocal(', 'e.upsertExplicitMemory(',
          ])

          require('source_adapter', [
              'resolveLocalFabricMemory(', 'listTagFabric(',
              'upsertExplicitMemoryBounded(', 'explicitDeleteMemory(',
          ])
          forbid('source_adapter', [
              'e.resolveIDLocal(', 'e.listTagLocal(', 'e.upsertExplicitMemory(',
          ])

          require('mesh', [
              'direct-read-no-import', 'sovereign-memory-event+ed25519-grant',
              'consumeMeshGrant(req.Grant', 'shared_grant', 'tls-required',
          ])
          require('grant', [
              'ed25519.Sign', 'ed25519.Verify', 'mesh grant replay rejected',
              'ExpiresUnix', 'TargetNode',
          ])
          require('transport', [
              'plaintext mesh HTTP is restricted to loopback',
              'non-loopback mesh listener requires',
              'wildcard mesh listener requires explicit MEMORYAI_MESH_ENDPOINT',
          ])

          require('lifetime_test', [
              'TestUpsertExplicitMemoryDoesNotReenterDataLock',
              'upsertExplicitMemoryBounded',
              'TestRemoteJSONImportIsDirectReadOnly',
              'TestSpeculativePinnedStoreAvoidsNestedReadDeadlock',
              'TestPersistWaitsForSpeculativeStoreLease',
          ])
          require('fabric_test', [
              'TestExplicitImportCreatesInBoundedShard',
              'TestExplicitImportUpdatesExistingShardOwnerWithoutDuplicate',
              'TestDuplicateFabricIdentityIsRejected',
              'TestSourceAdapterLivesAcrossStorageShard',
          ])
          require('digest_test', ['TestMemoryStructuralDigestIgnoresRuntimeExecCount'])

          print('Kernel frozen architecture boundaries: PASS')
          PY
