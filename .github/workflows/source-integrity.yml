name: source-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source_integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without external actions
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify immutable bootstrap and current Memory seed chain
        run: python3 tools/restore_source.py --check

      - name: Restore generated Kernel and current Memory seed
        run: python3 tools/restore_source.py

      - name: Compile Python build and migration tools
        run: |
          python3 -m py_compile tools/*.py tools/migrations/*.py

      - name: Enforce frozen architecture ownership
        run: python3 tools/architecture_audit.py

      - name: Enforce formatted Go source
        run: |
          UNFORMATTED="$(gofmt -l Kernel/src/*.go)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go source:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet Kernel package
        env:
          GO111MODULE: "off"
        run: go vet ./Kernel/src

      - name: Compile and test Kernel package
        env:
          GO111MODULE: "off"
        run: go test ./Kernel/src

      - name: Race-test Kernel package
        env:
          GO111MODULE: "off"
        run: go test -race ./Kernel/src
