name: mutation-journal-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mutation_journal_integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Restore source
        run: python3 tools/restore_source.py
      - name: Assert journal-aware ACK boundary
        run: |
          python3 tools/architecture_audit.py
          ! grep -n 'persistEngineIfDirty(sp)' Kernel/src/kernel.go
          grep -n 'persistEngineIncremental(sp)' Kernel/src/kernel.go
          grep -n 'physicalMemoryWithJournal' Kernel/src/remote_durability_runtime.go
      - name: Run journal regressions
        env:
          GO111MODULE: "off"
        run: go test -race ./Kernel/src -run 'MutationJournal|PhysicalMemoryWithJournal|TransferProbeTreatsJournal'
