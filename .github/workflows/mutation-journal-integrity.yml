name: mutation-journal-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mutation_journal_integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without external actions
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Restore generated Kernel source
        run: python3 tools/restore_source.py

      - name: Assert in-body incremental persistence boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kernel = Path('Kernel/src/kernel.go').read_text(encoding='utf-8')
          runtime = Path('Kernel/src/mutation_journal_runtime.go').read_text(encoding='utf-8')
          tests = Path('Kernel/src/mutation_journal_runtime_test.go').read_text(encoding='utf-8')

          start = kernel.find('func (e *Engine) persistAll() error {')
          end = kernel.find('\nfunc ', start + 1)
          if start < 0 or end < 0:
              raise SystemExit('generated persistAll boundary missing')
          persist_all = kernel[start:end]

          required_persist_all = [
              'persistEngineIncremental(e)',
              'persistEngineIncremental(sp)',
          ]
          missing = [x for x in required_persist_all if x not in persist_all]
          if missing:
              raise SystemExit(f'persistAll incremental boundary missing: {missing}')
          if 'persistEngineIfDirty(e)' in persist_all or 'persistEngineIfDirty(sp)' in persist_all:
              raise SystemExit('generated persistAll still performs full-body persistence')

          # Remote mem-node mutation ACK paths intentionally remain on full
          # persistence until their physical post-error verification becomes
          # journal-aware. Entry 008 protects this separation explicitly.
          remote_full_barriers = kernel.count('persistEngineIfDirty(sp)')
          if remote_full_barriers != 2:
              raise SystemExit(
                  f'expected two remote full-durability barriers outside persistAll, got {remote_full_barriers}'
              )

          required_kernel = [
              'loadEngineWithMutationJournal(',
              'writeDetZipWithMutationJournal(out, entries)',
          ]
          required_runtime = [
              'mutationJournalCommentSize = 65535',
              'mutationJournalSlotSize',
              'mutationJournalBaseFingerprint',
              'restoreMutationJournal',
              'writeMutationJournal',
              'MEMORYAI_MUTATION_JOURNAL_MAX_ENTRIES',
              'return e.saveBody(e.bodyPath)',
          ]
          required_tests = [
              'TestMutationJournalRestartRestoresWithoutFullBodyRewrite',
              'TestMutationJournalFallsBackToPreviousValidSlot',
              'TestMutationJournalNeverCreatesSidecarFile',
          ]
          for label, text, required in [
              ('generated Kernel', kernel, required_kernel),
              ('runtime', runtime, required_runtime),
              ('tests', tests, required_tests),
          ]:
              missing = [x for x in required if x not in text]
              if missing:
                  raise SystemExit(f'{label} mutation-journal boundary missing: {missing}')
          forbidden = ['.delta.json', 'Memory.wal', 'Memory.journal']
          bad = [x for x in forbidden if x in runtime]
          if bad:
              raise SystemExit(f'forbidden persistent sidecar path introduced: {bad}')
          print('In-body bounded mutation journal boundary: PASS')
          PY

      - name: Assert overlay preserves remote durability barriers
        run: |
          python3 - <<'PY'
          from tools.kernel_mutation_journal_overlay import apply_kernel_mutation_journal_overlay

          fixture = b'''package main
          func loadEngineCanonical(x string){}
          func (e *Engine) persistAll() error {
              if err := persistEngineIfDirty(e); err != nil { return err }
              for _, sp := range spaces { if err := persistEngineIfDirty(sp); err != nil { return err } }
              return nil
          }
          func remoteA(){ _ = persistEngineIfDirty(sp) }
          func remoteB(){ _ = persistEngineIfDirty(sp) }
          func (e *Engine) saveBody(out string) error {
              if err := writeDetZip(out, entries); err != nil { return err }
              return nil
          }
          '''
          out = apply_kernel_mutation_journal_overlay(fixture).decode('utf-8')
          assert out.count('persistEngineIncremental(e)') == 1
          assert out.count('persistEngineIncremental(sp)') == 1
          assert out.count('persistEngineIfDirty(sp)') == 2
          assert 'loadEngineCanonical(' not in out
          print('Mutation journal overlay multi-barrier isolation: PASS')
          PY

      - name: Check formatting
        run: test -z "$(gofmt -l Kernel/src/mutation_journal_runtime.go Kernel/src/mutation_journal_runtime_test.go)"

      - name: Run mutation journal regressions
        env:
          GO111MODULE: "off"
        run: go test ./Kernel/src -run 'MutationJournal'

      - name: Race-test mutation journal regressions
        env:
          GO111MODULE: "off"
        run: go test -race ./Kernel/src -run 'MutationJournal'
