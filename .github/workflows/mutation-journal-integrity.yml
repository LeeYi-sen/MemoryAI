name: mutation-journal-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mutation_journal_integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without external actions
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Restore generated Kernel source
        run: python3 tools/restore_source.py

      - name: Assert in-body incremental persistence boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          kernel = Path('Kernel/src/kernel.go').read_text(encoding='utf-8')
          runtime = Path('Kernel/src/mutation_journal_runtime.go').read_text(encoding='utf-8')
          tests = Path('Kernel/src/mutation_journal_runtime_test.go').read_text(encoding='utf-8')
          required_kernel = [
              'persistEngineIncremental(e)',
              'persistEngineIncremental(sp)',
              'loadEngineWithMutationJournal(',
              'writeDetZipWithMutationJournal(out, entries)',
          ]
          required_runtime = [
              'mutationJournalCommentSize = 65535',
              'mutationJournalSlotSize',
              'mutationJournalBaseFingerprint',
              'restoreMutationJournal',
              'writeMutationJournal',
              'MEMORYAI_MUTATION_JOURNAL_MAX_ENTRIES',
              'return e.saveBody(e.bodyPath)',
          ]
          required_tests = [
              'TestMutationJournalRestartRestoresWithoutFullBodyRewrite',
              'TestMutationJournalFallsBackToPreviousValidSlot',
              'TestMutationJournalNeverCreatesSidecarFile',
          ]
          for label, text, required in [
              ('generated Kernel', kernel, required_kernel),
              ('runtime', runtime, required_runtime),
              ('tests', tests, required_tests),
          ]:
              missing = [x for x in required if x not in text]
              if missing:
                  raise SystemExit(f'{label} mutation-journal boundary missing: {missing}')
          forbidden = ['.delta.json', 'Memory.wal', 'Memory.journal']
          bad = [x for x in forbidden if x in runtime]
          if bad:
              raise SystemExit(f'forbidden persistent sidecar path introduced: {bad}')
          if 'persistEngineIfDirty(e)' in kernel or 'persistEngineIfDirty(sp)' in kernel:
              raise SystemExit('generated persistAll still performs full-body persistence')
          print('In-body bounded mutation journal boundary: PASS')
          PY

      - name: Check formatting
        run: test -z "$(gofmt -l Kernel/src/mutation_journal_runtime.go Kernel/src/mutation_journal_runtime_test.go)"

      - name: Run mutation journal regressions
        env:
          GO111MODULE: "off"
        run: go test ./Kernel/src -run 'MutationJournal'

      - name: Race-test mutation journal regressions
        env:
          GO111MODULE: "off"
        run: go test -race ./Kernel/src -run 'MutationJournal'
