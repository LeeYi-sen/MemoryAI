name: remote-body-integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  remote_body_integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Restore source
        run: python3 tools/restore_source.py
      - name: Assert journal-aware remote durability
        run: python3 tools/architecture_audit.py
      - name: Run remote-body and transfer regressions
        env:
          GO111MODULE: "off"
        run: go test -race ./Kernel/src -run 'RemoteBody|PassiveBody|Mount|Unmount|RootClose|RemoteMutationACK|TransferMemoryDurable|TransferSource|TransferDelete|PhysicalMemoryWithJournal|TransferProbeTreatsJournal'
