name: physical-runtime-boundary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  physical_runtime_boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${REPO_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify direct source layout
        run: python3 tools/test_repository_source_layout.py
      - name: Architecture audit
        run: python3 tools/architecture_audit.py
      - name: Assert no compiled cognitive growth owner
        run: |
          test -z "$(find Kernel/src -maxdepth 1 -name 'memory_growth_*.go' -print)"
          ! grep -R -n -E 'RunAutonomousMemoryGrowthCycle|RunAutonomousContextBranchingCycle|RunAutonomousGroundedActionCycle|RunAutonomousRemoteEvidenceIntakeCycle' Kernel/src
      - name: Physical CPU/GPU tests
        env:
          GO111MODULE: "off"
        run: go test -race ./Kernel/src -run 'PhysicalRuntime|PhysicalExecution|ParallelDot|AutomaticShardDisk'
